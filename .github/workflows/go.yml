name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Runs the tests of every module of go.work,
    # including the exceltable submodule that go test ./... does not reach
    - name: Test workspace modules
      run: ./test-workspace.sh
